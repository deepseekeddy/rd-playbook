name: Approved Requirement Change / 需求变更
description: PRD Approved 之后的范围或验收变更
title: "[CHANGE][REQ-YYYY-NNN] "
labels: ["type:change"]
body:
  - type: input
    id: parent
    attributes:
      label: 关联父需求
      placeholder: "#123 / REQ-2026-042"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 变化了什么
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因与原始证据
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响分析
      description: 产品、设计、TSD、代码、测试、发布、运营和日期。
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: 受影响 Issue/PR/版本
    validations:
      required: true
  - type: input
    id: approver
    attributes:
      label: 批准人
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: 新基线版本
    validations:
      required: true
